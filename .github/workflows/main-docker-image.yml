name: bashsiz.com image push main

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - "README.md"
      - "deploy/k8s/**"

jobs:
  push_to_registry:
    name: Push Docker image to Docker registry
    # Only ever build from main (also guards manual runs started on other branches)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Login to registry
        uses: redhat-actions/podman-login@v1
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Get current date
        id: tag
        run: echo "tag=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Build Image
        id: build
        uses: redhat-actions/buildah-build@v2
        with:
          image: netsudoer/production-bashsiz-com
          tags: latest ${{ steps.tag.outputs.tag }} ${{ github.sha }}
          containerfiles: |
            ./Dockerfile

      - name: Push image
        uses: redhat-actions/push-to-registry@v2
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          image: ${{ steps.build.outputs.image }}
          tags: ${{ steps.build.outputs.tags }}

      # Optional: roll the deployment automatically after each push.
      # Requires the KUBECONFIG secret (see README).
      # - name: Configure kubeconfig
      #   run: |
      #     mkdir -p ~/.kube
      #     echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
      #     chmod 600 ~/.kube/config
