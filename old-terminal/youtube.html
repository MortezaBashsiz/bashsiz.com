<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Morteza Bashsiz — ~/youtube</title>
  <meta name="description" content="Videos by Morteza Bashsiz on YouTube.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23111512'/><text x='5' y='22' font-family='monospace' font-size='16' fill='%234ade80'>&gt;_</text></svg>">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <main class="terminal">
    <div class="titlebar">
      <div class="dots"><span></span><span></span><span></span></div>
      <div class="title">morteza@bashsiz: ~/youtube</div>
    </div>

    <nav class="tabs">
      <a href="index.html">~/about</a>
      <a href="github.html">~/github</a>
      <a href="youtube.html" class="active">~/youtube</a>
    </nav>

    <section class="screen" data-path="~/youtube">
      <p class="line cmd"><span data-prompt="~/youtube"></span> <span class="text">cat README</span></p>
      <div class="out">
        <h1 class="red">YouTube</h1>
        <!-- EDIT: describe your channel -->
        <p>Videos about Linux, networking and software. Subscribe at
          <a data-youtube-link target="_blank" rel="noopener"></a>.</p>
      </div>

      <p class="line cmd"><span data-prompt="~/youtube"></span> <span class="text">ls videos/</span></p>
      <div class="out" id="videos"></div>

      <div class="input-line" hidden>
        <span class="prompt-slot"></span>
        <input type="text" aria-label="terminal input" autocomplete="off" autocapitalize="off" spellcheck="false">
      </div>
    </section>

    <footer class="status">
      <span>[2] youtube</span>
      <span>© <span data-year></span> Morteza Bashsiz</span>
    </footer>
  </main>

  <script src="assets/config.js"></script>
  <script src="assets/main.js"></script>
</body>
</html>
